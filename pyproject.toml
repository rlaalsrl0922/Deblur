[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "wemp-deblur"
version = "0.1.0"
description = "WEMP main architecture, training losses, HDF5 loading and evaluation"
requires-python = ">=3.10"
dependencies = ["torch>=2.1,<2.6", "torchvision>=0.16,<0.21", "numpy<2", "einops", "PyYAML", "opencv-python<4.12", "Pillow", "scipy", "scikit-image", "h5py", "pandas", "tqdm", "lmdb", "tensorboard", "requests", "yapf"]
[project.optional-dependencies]
lpips = ["pyiqa"]
[tool.setuptools.packages.find]
include = ["basicsr*", "tools*"]
